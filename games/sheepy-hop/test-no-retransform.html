<!DOCTYPE html>
<html>
<head>
    <title>Sheepy Hop No Re-Transform Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        #output { background: black; color: lime; padding: 10px; height: 300px; overflow: auto; }
        button { margin: 5px; padding: 10px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Sheepy Hop No Re-Transform Test</h1>
    <button onclick="runTest()">Run Test</button>
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        
        function log(msg, className = '') {
            const div = document.createElement('div');
            if (className) div.className = className;
            div.textContent = msg;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }
        
        async function runTest() {
            output.innerHTML = '';
            log('Testing no re-transformation after reverting to normal...');
            
            // Load scripts
            const scripts = [
                'three.min.js',
                'js/constants.js',
                'js/levels.js',
                'js/assets.js',
                'js/audio.js',
                'js/state.js',
                'js/main.js'
            ];
            
            for (const src of scripts) {
                await new Promise(resolve => {
                    const script = document.createElement('script');
                    script.src = src;
                    script.onload = resolve;
                    document.head.appendChild(script);
                });
            }
            
            await new Promise(resolve => setTimeout(resolve, 500));
            
            if (!window.gameState) {
                log('ERROR: gameState not found', 'error');
                return;
            }
            
            gameState.reset();
            
            // Test 1: Collect 10 pink coins → transform
            log('\n1. Collecting 10 pink coins:');
            for (let i = 0; i < 10; i++) {
                gameState.collectPinkCoin();
                gameState.checkProgression();
            }
            log(`   isSheepy=${gameState.isSheepy}, hasTransformedFromFirst10=${gameState.hasTransformedFromFirst10}`);
            
            if (!gameState.isSheepy) {
                log('   ERROR: Should be sheepy!', 'error');
            } else {
                log('   ✓ Correctly transformed to sheepy', 'success');
            }
            
            // Test 2: Collect 10 gold coins → revert
            log('\n2. Collecting 10 gold coins:');
            for (let i = 0; i < 10; i++) {
                gameState.collectGoldCoin();
                gameState.checkProgression();
            }
            log(`   isSheepy=${gameState.isSheepy}, hasTransformedFromFirst10=${gameState.hasTransformedFromFirst10}`);
            
            if (gameState.isSheepy) {
                log('   ERROR: Should have reverted to normal!', 'error');
            } else {
                log('   ✓ Correctly reverted to normal', 'success');
            }
            
            // Test 3: Collect 10 more pink coins (11-20) → should NOT transform, should go to bonus at 20
            log('\n3. Collecting 10 more pink coins (11-20):');
            for (let i = 0; i < 10; i++) {
                gameState.collectPinkCoin();
                const triggered = gameState.checkProgression();
                log(`   Pink coin ${i+11}: isSheepy=${gameState.isSheepy}, triggered=${triggered}, gameState=${gameState.gameState}`);
                
                // Should NOT transform during coins 11-19
                if (i < 9 && gameState.isSheepy) {
                    log(`   ERROR: Should NOT transform again at pink coin ${i+11}!`, 'error');
                }
            }
            
            // At 20 pink coins, should be in BONUS state
            if (gameState.gameState === 'BONUS') {
                log('   ✓ Correctly went to bonus level at 20 pink coins', 'success');
            } else {
                log(`   ERROR: Should be in BONUS state! Current: ${gameState.gameState}`, 'error');
            }
            
            log('\n=== Test Complete ===');
        }
    </script>
</body>
</html>
