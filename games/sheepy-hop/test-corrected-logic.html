<!DOCTYPE html>
<html>
<head>
    <title>Sheepy Hop Corrected Logic Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        #output { background: black; color: lime; padding: 10px; height: 400px; overflow: auto; }
        button { margin: 5px; padding: 10px; }
        .phase { color: cyan; margin-top: 10px; }
        .error { color: red; }
        .success { color: green; }
        .warning { color: yellow; }
    </style>
</head>
<body>
    <h1>Sheepy Hop Corrected Logic Test</h1>
    <button onclick="runTest()">Test Corrected Logic</button>
    <button onclick="clearOutput()">Clear</button>
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        
        function log(msg, className = '') {
            const div = document.createElement('div');
            if (className) div.className = className;
            div.textContent = msg;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }
        
        function clearOutput() {
            output.innerHTML = '';
        }
        
        async function runTest() {
            clearOutput();
            log('=== Sheepy Hop Corrected Logic Test ===', 'phase');
            log('Testing the corrected game progression logic:');
            log('1. Collect 10 pink coins → Transform to sheepy');
            log('2. Collect 10 gold coins while sheepy → Revert to normal');
            log('3. Collect 10 more pink coins (total 20) → Start bonus level');
            log('');
            
            // Load required scripts
            const scripts = [
                'three.min.js',
                'js/constants.js',
                'js/levels.js',
                'js/assets.js',
                'js/audio.js',
                'js/state.js',
                'js/main.js'
            ];
            
            for (const src of scripts) {
                try {
                    await loadScript(src);
                    log(`✓ Loaded ${src}`);
                } catch (err) {
                    log(`✗ Failed to load ${src}: ${err.message}`, 'error');
                    return;
                }
            }
            
            // Wait for game to initialize
            await new Promise(resolve => setTimeout(resolve, 500));
            
            if (!window.gameState) {
                log('ERROR: gameState not found!', 'error');
                return;
            }
            
            log('\n=== Test 1: Basic progression ===', 'phase');
            gameState.reset();
            
            // Collect 10 pink coins
            for (let i = 0; i < 10; i++) {
                gameState.collectPinkCoin();
                const triggered = gameState.checkProgression();
                log(`Pink coin ${i+1}: total=${gameState.pinkCoinsCollected}, isSheepy=${gameState.isSheepy}, triggered=${triggered}`);
            }
            
            if (!gameState.isSheepy) {
                log('ERROR: Should be sheepy after 10 pink coins!', 'error');
            } else {
                log('✓ Correctly transformed to sheepy after 10 pink coins', 'success');
            }
            
            // Collect 10 gold coins
            log('\n=== Test 2: Gold coin collection ===', 'phase');
            for (let i = 0; i < 10; i++) {
                gameState.collectGoldCoin();
                const triggered = gameState.checkProgression();
                log(`Gold coin ${i+1}: total=${gameState.goldCoinsCollected}, isSheepy=${gameState.isSheepy}, triggered=${triggered}`);
            }
            
            if (gameState.isSheepy) {
                log('ERROR: Should have reverted to normal after 10 gold coins!', 'error');
            } else {
                log('✓ Correctly reverted to normal after 10 gold coins', 'success');
            }
            
            // Collect 10 more pink coins (total 20)
            log('\n=== Test 3: Collect 10 more pink coins for bonus ===', 'phase');
            // We already have 10 pink coins, need 10 more
            for (let i = 0; i < 10; i++) {
                gameState.collectPinkCoin();
                const triggered = gameState.checkProgression();
                log(`Pink coin ${i+11}: total=${gameState.pinkCoinsCollected}, gameState=${gameState.gameState}, triggered=${triggered}`);
            }
            
            if (gameState.gameState !== 'BONUS') {
                log(`ERROR: Should be in BONUS state after 20 pink coins! Current: ${gameState.gameState}`, 'error');
            } else {
                log('✓ Correctly started bonus level after 20 pink coins', 'success');
            }
            
            log('\n=== Test 4: Edge case - 20 pink coins before transforming ===', 'phase');
            gameState.reset();
            
            // Collect 20 pink coins at once
            for (let i = 0; i < 20; i++) {
                gameState.collectPinkCoin();
                const triggered = gameState.checkProgression();
                log(`Pink coin ${i+1}: total=${gameState.pinkCoinsCollected}, isSheepy=${gameState.isSheepy}, gameState=${gameState.gameState}, triggered=${triggered}`);
            }
            
            // Should go straight to bonus, not transform to sheepy
            if (gameState.isSheepy) {
                log('WARNING: Became sheepy but should have gone straight to bonus with 20 pink coins', 'warning');
            } else if (gameState.gameState !== 'BONUS') {
                log(`ERROR: Should be in BONUS state with 20 pink coins! Current: ${gameState.gameState}`, 'error');
            } else {
                log('✓ Correctly went straight to bonus level with 20 pink coins', 'success');
            }
            
            log('\n=== Test 5: Edge case - collect pink coins while sheepy ===', 'phase');
            gameState.reset();
            
            // Collect 10 pink coins to become sheepy
            for (let i = 0; i < 10; i++) {
                gameState.collectPinkCoin();
                gameState.checkProgression();
            }
            
            // Try to collect more pink coins while sheepy (shouldn't happen in game but test logic)
            const pinkBefore = gameState.pinkCoinsCollected;
            gameState.collectPinkCoin();
            const triggered = gameState.checkProgression();
            log(`While sheepy: pinkCoins=${pinkBefore}→${gameState.pinkCoinsCollected}, triggered=${triggered}, isSheepy=${gameState.isSheepy}`);
            
            if (gameState.pinkCoinsCollected !== pinkBefore + 1) {
                log('ERROR: Pink coin count should increase even while sheepy', 'error');
            } else {
                log('✓ Pink coin count increases (though player shouldn\'t collect pink coins while sheepy in actual game)', 'success');
            }
            
            log('\n=== All tests completed ===', 'phase');
        }
        
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => resolve();
                script.onerror = () => reject(new Error(`Failed to load ${src}`));
                document.head.appendChild(script);
            });
        }
    </script>
</body>
</html>
