<!DOCTYPE html>
<html>
<head>
    <title>Sheepy Hop Debug Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        #output { background: black; color: lime; padding: 10px; height: 300px; overflow: auto; }
        button { margin: 5px; }
    </style>
</head>
<body>
    <h1>Sheepy Hop Debug Test</h1>
    <button onclick="runTest()">Run Test</button>
    <button onclick="clearOutput()">Clear</button>
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        
        function log(msg) {
            output.innerHTML += msg + '<br>';
            output.scrollTop = output.scrollHeight;
        }
        
        function clearOutput() {
            output.innerHTML = '';
        }
        
        async function runTest() {
            clearOutput();
            log('Starting Sheepy Hop transformation test...');
            
            // Load required scripts
            const scripts = [
                'three.min.js',
                'js/constants.js',
                'js/levels.js',
                'js/assets.js',
                'js/audio.js',
                'js/state.js',
                'js/main.js'
            ];
            
            for (const src of scripts) {
                try {
                    await loadScript(src);
                    log(`✓ Loaded ${src}`);
                } catch (err) {
                    log(`✗ Failed to load ${src}: ${err.message}`);
                }
            }
            
            // Wait for game to initialize
            await new Promise(resolve => setTimeout(resolve, 500));
            
            log('\n=== Testing Game State ===');
            log(`gameState: ${window.gameState ? 'defined' : 'undefined'}`);
            log(`gameEngine: ${window.gameEngine ? 'defined' : 'undefined'}`);
            log(`audioManager: ${window.audioManager ? 'defined' : 'undefined'}`);
            
            if (window.gameState) {
                log(`\nInitial state:`);
                log(`- isSheepy: ${gameState.isSheepy}`);
                log(`- pinkCoinsCollected: ${gameState.pinkCoinsCollected}`);
                log(`- gameEngine reference: ${gameState.gameEngine ? 'set' : 'null'}`);
                
                // Test collecting 10 pink coins
                log('\n=== Simulating collection of 10 pink coins ===');
                for (let i = 0; i < 10; i++) {
                    gameState.collectPinkCoin();
                }
                
                log(`After collecting 10 pink coins:`);
                log(`- pinkCoinsCollected: ${gameState.pinkCoinsCollected}`);
                log(`- isSheepy: ${gameState.isSheepy}`);
                
                // Check progression
                log('\n=== Calling checkProgression() ===');
                const result = gameState.checkProgression();
                log(`checkProgression returned: ${result}`);
                log(`isSheepy after checkProgression: ${gameState.isSheepy}`);
                
                // Check if gameEngine was called
                if (window.gameEngine) {
                    log(`gameEngine.transformToSheepy was ${window.gameEngine.transformToSheepyCalled ? 'called' : 'NOT called'}`);
                }
                
                // Test UI update
                log('\n=== Testing UI ===');
                if (gameState.uiElements.titleText) {
                    log(`Title text: ${gameState.uiElements.titleText.innerText}`);
                }
                
                log('\n=== Test Complete ===');
            } else {
                log('ERROR: gameState not found!');
            }
        }
        
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => resolve();
                script.onerror = () => reject(new Error(`Failed to load ${src}`));
                document.head.appendChild(script);
            });
        }
        
        // Monkey-patch gameEngine.transformToSheepy to track calls
        const originalLoad = window.addEventListener;
        window.addEventListener = function(type, handler) {
            if (type === 'DOMContentLoaded') {
                const wrappedHandler = function() {
                    handler();
                    // After gameEngine is created, patch its transformToSheepy method
                    if (window.gameEngine) {
                        const original = window.gameEngine.transformToSheepy;
                        window.gameEngine.transformToSheepy = function() {
                            window.gameEngine.transformToSheepyCalled = true;
                            log('[DEBUG] gameEngine.transformToSheepy() called');
                            return original.apply(this, arguments);
                        };
                        window.gameEngine.transformToSheepyCalled = false;
                    }
                };
                return originalLoad.call(this, type, wrappedHandler);
            }
            return originalLoad.apply(this, arguments);
        };
    </script>
</body>
</html>
