<!DOCTYPE html>
<html>
<head>
    <title>Sheepy Hop Final Logic Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        #output { background: black; color: lime; padding: 10px; height: 300px; overflow: auto; }
        button { margin: 5px; padding: 10px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Sheepy Hop Final Logic Test</h1>
    <button onclick="runTest()">Test Final Logic</button>
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        
        function log(msg, className = '') {
            const div = document.createElement('div');
            if (className) div.className = className;
            div.textContent = msg;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }
        
        async function runTest() {
            output.innerHTML = '';
            log('Testing final logic with gold coin reset and === 10 check...');
            
            // Load scripts
            const scripts = [
                'three.min.js',
                'js/constants.js',
                'js/levels.js',
                'js/assets.js',
                'js/audio.js',
                'js/state.js',
                'js/main.js'
            ];
            
            for (const src of scripts) {
                await new Promise(resolve => {
                    const script = document.createElement('script');
                    script.src = src;
                    script.onload = resolve;
                    document.head.appendChild(script);
                });
            }
            
            await new Promise(resolve => setTimeout(resolve, 500));
            
            if (!window.gameState) {
                log('ERROR: gameState not found', 'error');
                return;
            }
            
            gameState.reset();
            
            // Test complete flow
            log('\n=== Complete Game Flow Test ===');
            
            // Phase 1: Collect 10 pink coins → transform
            log('\n1. Collecting 10 pink coins (1-10):');
            for (let i = 0; i < 10; i++) {
                gameState.collectPinkCoin();
                const triggered = gameState.checkProgression();
                log(`   Pink ${i+1}: total=${gameState.pinkCoinsCollected}, isSheepy=${gameState.isSheepy}, triggered=${triggered}`);
            }
            
            if (!gameState.isSheepy) {
                log('   ERROR: Should be sheepy!', 'error');
            } else {
                log('   ✓ Correctly transformed at exactly 10 pink coins', 'success');
            }
            
            // Phase 2: Collect 10 gold coins → revert
            log('\n2. Collecting 10 gold coins:');
            for (let i = 0; i < 10; i++) {
                gameState.collectGoldCoin();
                const triggered = gameState.checkProgression();
                log(`   Gold ${i+1}: total=${gameState.goldCoinsCollected}, isSheepy=${gameState.isSheepy}, triggered=${triggered}`);
                // Should revert on the 10th gold coin
                if (i === 9 && !triggered) {
                    log('   ERROR: Should have triggered reversion at 10th gold coin!', 'error');
                }
            }
            
            if (gameState.isSheepy) {
                log('   ERROR: Should have reverted to normal!', 'error');
            } else if (gameState.goldCoinsCollected !== 0) {
                log(`   ERROR: goldCoinsCollected should be 0 after reversion! Current: ${gameState.goldCoinsCollected}`, 'error');
            } else {
                log('   ✓ Correctly reverted and reset gold coins to 0', 'success');
            }
            
            // Phase 3: Collect 10 more pink coins (11-20) → should NOT transform, should go to bonus at 20
            log('\n3. Collecting 10 more pink coins (11-20):');
            for (let i = 0; i < 10; i++) {
                gameState.collectPinkCoin();
                const triggered = gameState.checkProgression();
                log(`   Pink ${i+11}: total=${gameState.pinkCoinsCollected}, isSheepy=${gameState.isSheepy}, triggered=${triggered}, gameState=${gameState.gameState}`);
                
                // Should NOT transform during coins 11-19
                if (i < 9 && gameState.isSheepy) {
                    log(`   ERROR: Should NOT transform at pink coin ${i+11}!`, 'error');
                }
                
                // At 20, should trigger bonus
                if (i === 9 && gameState.gameState !== 'BONUS') {
                    log(`   ERROR: Should be in BONUS state at 20 pink coins! Current: ${gameState.gameState}`, 'error');
                }
            }
            
            if (gameState.gameState === 'BONUS') {
                log('   ✓ Correctly went to bonus level at 20 pink coins', 'success');
            }
            
            // Test edge case: what if we collect pink coins while sheepy?
            log('\n4. Edge case: Collect pink coin while sheepy (simulate bug):');
            gameState.reset();
            
            // Get to sheepy state
            for (let i = 0; i < 10; i++) gameState.collectPinkCoin();
            gameState.checkProgression(); // Transform
            
            // Collect pink coin while sheepy (shouldn't happen in game but test)
            const pinkBefore = gameState.pinkCoinsCollected;
            gameState.collectPinkCoin();
            gameState.checkProgression();
            log(`   While sheepy: pink ${pinkBefore}→${gameState.pinkCoinsCollected}, isSheepy=${gameState.isSheepy}`);
            
            if (gameState.pinkCoinsCollected !== pinkBefore + 1) {
                log('   ERROR: Pink coin should increment', 'error');
            } else {
                log('   ✓ Pink coin increments (game shouldn\'t allow this but logic handles it)', 'success');
            }
            
            log('\n=== All tests completed ===');
        }
    </script>
</body>
</html>
