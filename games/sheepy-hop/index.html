<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sheepy Hop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');

        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: 'Bangers', 'Comic Sans MS', cursive; touch-action: none; }
        
        #ui-layer {
            position: absolute; top: 20px; left: 20px; color: white;
            pointer-events: none; text-shadow: 2px 2px 0 #000;
            user-select: none; display: none;
            z-index: 5;
            font-family: 'Bangers', cursive;
            letter-spacing: 1px;
        }
        h1 { margin: 0; color: #ff69b4; font-size: 30px; -webkit-text-stroke: 1px black; text-shadow: 3px 3px 0 #000; }
        p { margin: 5px 0; font-size: 24px; color: #fff; -webkit-text-stroke: 0.5px black; text-shadow: 2px 2px 0 #000;}
        .highlight { color: #ffd700; }

        #start-screen, #game-over-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #f0f0f0;
            background-image: radial-gradient(#4facfe 15%, transparent 16%), radial-gradient(#4facfe 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            display: flex; flex-direction: column; 
            justify-content: space-between; 
            align-items: center;
            z-index: 100;
            box-sizing: border-box;
            border: 20px solid #1a1a1a;
            padding: 60px 0;
        }

#game-over-screen {
            display: none;
            background-image: radial-gradient(#ff4d4d 15%, transparent 16%), radial-gradient(#ff4d4d 15%, transparent 16%);
            border-color: #ff4d4d;
        }

        #comic-panel {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; height: 90%;
            max-width: 800px;
            z-index: 0;
            pointer-events: none;
            background: white;
            border: 4px solid black;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        #title-logo, #game-over-title {
            z-index: 1;
            font-size: 100px; color: #FFD700;
            -webkit-text-stroke: 3px black;
            text-shadow: 5px 5px 0 #FF69B4, 10px 10px 0 #000;
            margin-top: 20px;
            transform: rotate(-3deg);
            animation: floatTitle 3s ease-in-out infinite;
            text-align: center;
            line-height: 0.9;
        }
        
#game-over-title {
            color: #1a1a1a;
            text-shadow: 5px 5px 0 #ff4d4d, 10px 10px 0 #fff;
            font-size: 80px;
        }

        #button-container {
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .menu-btn {
            background-color: #FF69B4; color: white;
            border: 4px solid black; border-radius: 10px;
            padding: 10px 40px; font-size: 40px; margin: 10px;
            cursor: pointer; box-shadow: 5px 5px 0 black;
            font-family: 'Bangers', cursive; transition: transform 0.1s;
            text-transform: uppercase;
        }
        .menu-btn:active { transform: translate(5px, 5px); box-shadow: 0 0 0 black; }
        .menu-btn:hover { background-color: #ff8ec6; transform: rotate(1deg) scale(1.05); }
        .menu-btn.secondary { background-color: #4facfe; font-size: 30px; }

        #credits-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 300px; padding: 20px; background: white; border: 4px solid black;
            box-shadow: 10px 10px 0 black;
            text-align: center; display: none; z-index: 101;
            font-family: 'Bangers', cursive;
        }
        #credits-modal h2 { color: #4facfe; -webkit-text-stroke: 1px black; font-size: 40px; margin: 0;}
        #credits-modal p { color: #333; font-size: 20px; font-family: sans-serif; }
        .close-btn {
            background: #ff4d4d; color: white; border: 3px solid black; padding: 5px 20px;
            font-size: 20px; cursor: pointer; margin-top: 15px; font-family: 'Bangers', cursive;
            box-shadow: 3px 3px 0 black;
        }
        .close-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 black; }
        
        #leaderboard-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 320px; padding: 20px; background: white; border: 4px solid black;
            box-shadow: 10px 10px 0 black;
            text-align: center; display: none; z-index: 102;
            font-family: 'Bangers', cursive;
        }

        #level-splash-1 {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; z-index: 200;
            justify-content: center; align-items: center; color: #FFF;
            font-family: 'Bangers', cursive; font-size: 100px; letter-spacing: 5px;
            -webkit-text-stroke: 3px black; text-shadow: 5px 5px 0 #FF69B4;
            animation: splashFadeInOut 2.5s forwards;
            pointer-events: none;
        }

        @keyframes splashFadeInOut {
            0% { opacity: 0; transform: scale(0.5); }
            20% { opacity: 1; transform: scale(1.2); }
            30% { transform: scale(1); }
            80% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.5); display: none; }
        }

        #level-complete-banner {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 150;
            pointer-events: none;
            display: none;
        }
        #level-complete-banner .banner-title {
            font-family: 'Bangers', cursive;
            font-size: 90px;
            color: #FFD700;
            -webkit-text-stroke: 3px black;
            text-shadow: 5px 5px 0 #FF69B4, 10px 10px 0 #000;
            line-height: 1;
        }
        #level-complete-banner .banner-score {
            font-family: 'Bangers', cursive;
            font-size: 40px;
            color: white;
            -webkit-text-stroke: 1px black;
            text-shadow: 3px 3px 0 #000;
            margin-top: 10px;
        }
        @keyframes bannerPop {
            0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
            20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            30%  { transform: translate(-50%, -50%) scale(1); }
            75%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
        }

        @keyframes floatTitle {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-10px) rotate(-1deg); }
        }

        #joystick-container {
            position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%; touch-action: none; z-index: 10; display: none;
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.5); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none;
        }
        #action-btn {
            position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px;
            background: rgba(255, 105, 180, 0.5); border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3); display: flex;
            justify-content: center; align-items: center; font-size: 40px;
            cursor: pointer; z-index: 10; user-select: none; touch-action: none;
            transition: transform 0.1s; display: none;
        }
        #action-btn:active { transform: scale(0.9); background: rgba(255, 105, 180, 0.8); }
    </style>
</head>
<body>
    <div id="start-screen">
        <div id="comic-panel">
            <svg width="100%" height="100%" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
                <rect width="800" height="600" fill="#87CEEB" />
                <g transform="translate(400, 300)"><circle r="600" fill="none" stroke="white" stroke-width="100" stroke-dasharray="20 40" opacity="0.3" /></g>
                <path d="M0,450 Q200,350 400,450 T800,450 V600 H0 Z" fill="#2d5a27" stroke="black" stroke-width="3" />
                <path d="M0,500 Q300,450 600,500 T900,600 H0 Z" fill="#3cb043" stroke="black" stroke-width="3" />
                <g fill="white" stroke="black" stroke-width="3">
                    <circle cx="100" cy="100" r="40" /><circle cx="150" cy="120" r="50" /><circle cx="200" cy="100" r="40" /><circle cx="600" cy="80" r="30" /><circle cx="650" cy="80" r="40" />
                </g>
                <g transform="translate(400, 220)">
                    <ellipse cx="0" cy="120" rx="60" ry="20" fill="rgba(0,0,0,0.3)" />
                    <rect x="-30" y="50" width="15" height="40" fill="#333" rx="5" /><rect x="15" y="50" width="15" height="40" fill="#333" rx="5" />
                    <circle cx="0" cy="0" r="60" fill="white" stroke="black" stroke-width="4" />
                    <circle cx="-40" cy="-20" r="20" fill="white" stroke="black" stroke-width="3" /><circle cx="40" cy="-20" r="20" fill="white" stroke="black" stroke-width="3" />
                    <circle cx="-30" cy="30" r="20" fill="white" stroke="black" stroke-width="3" /><circle cx="30" cy="30" r="20" fill="white" stroke="black" stroke-width="3" />
                    <circle cx="0" cy="-40" r="25" fill="white" stroke="black" stroke-width="3" />
                    <rect x="-25" y="-40" width="50" height="50" fill="#333" rx="10" />
                    <circle cx="-12" cy="-25" r="8" fill="white" /><circle cx="12" cy="-25" r="8" fill="white" /><circle cx="-12" cy="-25" r="3" fill="black" /><circle cx="12" cy="-25" r="3" fill="black" />
                    <path d="M-80,20 Q-100,50 -120,20" fill="none" stroke="black" stroke-width="3" /><path d="M-90,0 Q-110,30 -130,0" fill="none" stroke="black" stroke-width="3" />
                </g>
                <circle cx="200" cy="230" r="20" fill="#FF69B4" stroke="black" stroke-width="3" /><text x="192" y="240" font-family="sans-serif" font-weight="bold" font-size="25" fill="white">$</text>
                <circle cx="600" cy="180" r="20" fill="#FF69B4" stroke="black" stroke-width="3" /><text x="592" y="190" font-family="sans-serif" font-weight="bold" font-size="25" fill="white">$</text>
            </svg>
        </div>
        <div id="title-logo">Sheepy Hop</div>
        <div id="button-container">
            <button id="btn-start" class="menu-btn">Play!</button>
            <button id="btn-credits" class="menu-btn secondary">Credits</button>
            <button id="btn-leaderboard" class="menu-btn secondary">High Scores</button>
            <p style="font-size: 16px; color: #555; margin-top: 5px;">(Click anywhere to enable audio)</p>
        </div>
    </div>
    
    <!-- Global Leaderboard -->
    <div id="leaderboard-modal">
        <h2 style="color: #FF69B4; font-size: 32px; margin: 0; -webkit-text-stroke: 1px black;">Top Scores</h2>
        <ul id="leaderboard-list" style="list-style: none; padding: 0; margin: 15px 0 0 0; font-family: 'Bangers', sans-serif; font-size: 22px; color: #333; text-align: left; line-height: 1.4;">
            <li>Loading global scores...</li>
        </ul>
        <button class="close-btn" onclick="document.getElementById('leaderboard-modal').style.display='none'">Close</button>
    </div>

<!-- Game Over Screen -->
    <div id="game-over-screen">
        <div id="game-over-title">GAME<br>OVER!</div>
        <div style="z-index:1; text-align:center;">
             <p style="font-size: 40px; color: black; -webkit-text-stroke: 0px; margin-bottom: 5px;">Final Score: <span id="go-final-score" style="color:#ff4d4d;">0</span></p>
             
             <!-- Score saving UI for game over -->
             <div id="go-score-save-container" style="margin-top: 15px;">
                 <input type="text" id="go-player-name-input" placeholder="Enter your name" maxlength="15" style="padding: 10px; font-size: 24px; font-family: 'Bangers', cursive; border: 4px solid black; text-align: center; width: 220px; outline: none;">
                 <br>
                 <button id="btn-go-save-score" class="menu-btn secondary" style="margin-top: 10px; font-size: 28px; padding: 5px 30px; background-color: #ff4d4d;">Save Score</button>
             </div>
             
             <p id="go-save-status-msg" style="font-size: 24px; color: #1a1a1a; display: none; margin-top: 10px;">Score Saved!</p>
        </div>
        <div id="button-container">
            <button id="btn-try-again" class="menu-btn" style="background-color: #1a1a1a; color: #ff4d4d;">Try Again</button>
        </div>
    </div>

    <div id="credits-modal">
        <h2>Credits</h2>
        <p>Created By Olivia</p>
        <p>A Sheepy Adventure</p>
        <p>Comic Art: By Sheepy</p>
        <button class="close-btn" onclick="document.getElementById('credits-modal').style.display='none'">Close</button>
    </div>

    <div id="ui-layer">
        <h1 id="title-text">Collect 10 Pink Coins!</h1>
        <p id="coin-display">Coins: <span id="coin-count" class="highlight">0</span> / 10</p>
        <p>Score: <span id="score">0</span></p>
        <div id="lives-display" style="position: fixed; top: 20px; right: 20px; font-size: 32px; -webkit-text-stroke: 0px; text-shadow: 2px 2px 0 #000;">Lives: <span id="lives-icons">🐑🐑🐑</span></div>
    </div>
    
    <div id="joystick-container"><div id="joystick-knob"></div></div>
    <div id="action-btn">🐑</div>
    <div id="canvas-container"></div>
    
    <!-- Option 1 Splash Screen -->
    <div id="level-splash-1">LEVEL 1</div>

    <!-- Option C: In-game level complete banner -->
    <div id="level-complete-banner">
        <div class="banner-title">LEVEL<br>COMPLETE!</div>
        <div class="banner-score">Score: <span id="banner-score-value">0</span></div>
    </div>

    <script src="three.min.js"></script>
    
    <!-- Firebase Data SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebaseManager.js?v=1"></script>
    
    <script src="js/constants.js?v=6"></script>
    <script src="js/levels.js?v=6"></script>
    <script src="js/assets.js?v=6"></script>
    <script src="js/audio.js?v=6"></script>
    <script src="js/state.js?v=6"></script>
    <script src="js/main.js?v=6"></script>
</body>
</html>
