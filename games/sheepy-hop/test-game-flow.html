<!DOCTYPE html>
<html>
<head>
    <title>Sheepy Hop Game Flow Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        #output { background: black; color: lime; padding: 10px; height: 400px; overflow: auto; }
        button { margin: 5px; padding: 10px; }
        .phase { color: cyan; margin-top: 10px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Sheepy Hop Game Flow Test</h1>
    <button onclick="runTest()">Run Complete Game Flow Test</button>
    <button onclick="clearOutput()">Clear</button>
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        
        function log(msg, className = '') {
            const div = document.createElement('div');
            if (className) div.className = className;
            div.textContent = msg;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }
        
        function clearOutput() {
            output.innerHTML = '';
        }
        
        async function runTest() {
            clearOutput();
            log('=== Sheepy Hop Game Flow Test ===', 'phase');
            log('Testing the complete game progression:');
            log('1. Phase 1: Collect 10 pink coins → Transform to sheepy');
            log('2. Phase 2: Collect 10 gold coins → Revert to normal');
            log('3. Phase 3: Collect 10 more pink coins (total 20) → Start bonus level');
            log('4. Phase 4: Bonus round for 10 seconds');
            log('');
            
            // Load required scripts
            const scripts = [
                'three.min.js',
                'js/constants.js',
                'js/levels.js',
                'js/assets.js',
                'js/audio.js',
                'js/state.js',
                'js/main.js'
            ];
            
            for (const src of scripts) {
                try {
                    await loadScript(src);
                    log(`✓ Loaded ${src}`);
                } catch (err) {
                    log(`✗ Failed to load ${src}: ${err.message}`, 'error');
                    return;
                }
            }
            
            // Wait for game to initialize
            await new Promise(resolve => setTimeout(resolve, 500));
            
            if (!window.gameState) {
                log('ERROR: gameState not found!', 'error');
                return;
            }
            
            log('\n=== Initial State ===');
            logState();
            
            // Test Phase 1: Collect 10 pink coins
            log('\n=== Phase 1: Collecting 10 pink coins ===', 'phase');
            for (let i = 0; i < 10; i++) {
                gameState.collectPinkCoin();
                gameState.checkProgression();
                log(`Collected pink coin ${i+1}: pinkCoins=${gameState.pinkCoinsCollected}, isSheepy=${gameState.isSheepy}`);
            }
            logState();
            
            if (!gameState.isSheepy) {
                log('ERROR: Should be sheepy after 10 pink coins!', 'error');
            } else {
                log('✓ Successfully transformed to sheepy!', 'success');
            }
            
            // Test Phase 2: Collect 10 gold coins
            log('\n=== Phase 2: Collecting 10 gold coins ===', 'phase');
            for (let i = 0; i < 10; i++) {
                gameState.collectGoldCoin();
                gameState.checkProgression();
                log(`Collected gold coin ${i+1}: goldCoins=${gameState.goldCoinsCollected}, isSheepy=${gameState.isSheepy}`);
            }
            logState();
            
            if (gameState.isSheepy) {
                log('ERROR: Should have reverted to normal after 10 gold coins!', 'error');
            } else {
                log('✓ Successfully reverted to normal!', 'success');
            }
            
            // Test Phase 3: Collect 10 more pink coins (total 20)
            log('\n=== Phase 3: Collecting 10 more pink coins (total 20) ===', 'phase');
            // We already have 10 pink coins, need 10 more
            for (let i = 0; i < 10; i++) {
                gameState.collectPinkCoin();
                gameState.checkProgression();
                log(`Collected pink coin ${i+11}: pinkCoins=${gameState.pinkCoinsCollected}, gameState=${gameState.gameState}`);
            }
            logState();
            
            if (gameState.gameState !== 'BONUS') {
                log(`ERROR: Should be in BONUS state after 20 pink coins! Current state: ${gameState.gameState}`, 'error');
            } else {
                log('✓ Successfully started bonus level!', 'success');
            }
            
            // Test Phase 4: Bonus level timer
            log('\n=== Phase 4: Bonus level (simulating 5 seconds) ===', 'phase');
            const initialTime = gameState.bonusTimeRemaining;
            // Simulate 5 seconds passing
            for (let i = 0; i < 5; i++) {
                gameState.updateBonusLevel(1.0); // 1 second delta
                log(`Bonus time remaining: ${Math.ceil(gameState.bonusTimeRemaining)}s`);
            }
            
            if (gameState.bonusTimeRemaining >= initialTime) {
                log('ERROR: Bonus timer should be counting down!', 'error');
            } else {
                log('✓ Bonus timer is counting down correctly!', 'success');
            }
            
            // Simulate remaining time to finish level
            log('\n=== Finishing bonus level ===', 'phase');
            while (gameState.bonusTimeRemaining > 0) {
                gameState.updateBonusLevel(1.0);
            }
            
            if (gameState.gameState !== 'FINISHED') {
                log(`ERROR: Should be in FINISHED state after bonus time! Current state: ${gameState.gameState}`, 'error');
            } else {
                log('✓ Successfully finished level!', 'success');
            }
            
            log('\n=== Test Complete ===', 'phase');
            log('All game phases tested successfully!', 'success');
        }
        
        function logState() {
            log(`State: gameState=${gameState.gameState}, isSheepy=${gameState.isSheepy}`);
            log(`Coins: pink=${gameState.pinkCoinsCollected}, gold=${gameState.goldCoinsCollected}`);
            log(`Bonus time: ${gameState.bonusTimeRemaining.toFixed(1)}s`);
        }
        
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => resolve();
                script.onerror = () => reject(new Error(`Failed to load ${src}`));
                document.head.appendChild(script);
            });
        }
    </script>
</body>
</html>
