    <!-- Face -->
    <ellipse cx="302" cy="548" rx="27" ry="30" fill="#000"/>
    <ellipse cx="498" cy="548" rx="27" ry="30" fill="#000"/>
    <circle cx="312" cy="537" r="8" fill="#fff" stroke="none"/>
    <circle cx="508" cy="537" r="8" fill="#fff" stroke="none"/>
    <path d="M362,585 Q400,618 438,585" fill="none" stroke-width="8"/>
    <path d="M372,594 L381,618 L390,601 Z" stroke-width="5"/>
    <path d="M428,594 L419,618 L410,601 Z" stroke-width="5"/>
