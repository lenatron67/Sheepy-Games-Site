      <path d="M110,930 L110,820 C160,750 230,705 300,690 C330,670 360,700 400,682 C440,700 470,670 500,690 C570,705 640,750 690,820 L690,930 Z"/>
      <ellipse cx="285" cy="785" rx="46" ry="30" transform="rotate(-15 285 785)" stroke-width="7"/>
      <ellipse cx="470" cy="760" rx="44" ry="28" transform="rotate(10 470 760)" stroke-width="7"/>
      <ellipse cx="385" cy="828" rx="34" ry="18" transform="rotate(-5 385 828)" stroke-width="7"/>
    </g>
