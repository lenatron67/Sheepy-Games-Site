    <path d="M110,110 l14,30 32,4 -24,22 7,32 -29,-16 -29,16 7,-32 -24,-22 32,-4 Z"/>
    <path d="M560,60 l9,19 20,3 -15,14 4,20 -18,-10 -18,10 4,-20 -15,-14 20,-3 Z" transform="translate(-150,-15)"/>
    <path d="M60,390 l9,19 20,3 -15,14 4,20 -18,-10 -18,10 4,-20 -15,-14 20,-3 Z"/>

    <!-- Wings (behind the body) -->
    <path d="M165,520 C120,470 70,450 22,468 C42,515 40,560 52,612 C78,592 106,598 118,628 C130,610 148,610 162,626 Z"/>
    <path d="M635,520 C680,470 730,450 778,468 C758,515 760,560 748,612 C722,592 694,598 682,628 C670,610 652,610 638,626 Z"/>
    <path d="M60,500 C90,520 120,560 125,610" fill="none" stroke-width="7"/>
    <path d="M740,500 C710,520 680,560 675,610" fill="none" stroke-width="7"/>

